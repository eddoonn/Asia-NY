name: discord-daily-signal

on:
  schedule:
    - cron: '10 22 * * *'  # 22:10 UTC - armed (NY-late levels + triggers)
    - cron: '10 8 * * *'   # 08:10 UTC - triggered/closed result
  workflow_dispatch:
    inputs:
      test:
        description: 'Send webhook test instead of session state'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send Discord daily signal
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python notify.py --test
          else
            python notify.py
          fi
